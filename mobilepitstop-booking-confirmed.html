<!-- ==========================================================================
     MobilePitStop — BOOKING CONFIRMED  (compact build, tracking v2)
     https://mobilepitstop.uk/booking-confirmed

     WHY THIS IS SHORT
     Your Fluid Engine grid is about 394px tall with overflow CLIPPED.
     The "Areas We Cover" block was 297px and behaved perfectly; the tall
     confirmation block overflowed and got drawn over the header and
     footer. So this one is built to fit: roughly 260-300px, no
     accordions, nothing that grows.

     Everything that used to be in here — what happens next, the prep
     list, the plan pitch, the socials — belongs in the confirmation
     EMAIL, which is the thing customers actually read. The copy for that
     is in mobilepitstop-confirmation-email-copy.md.

     STILL DO THIS: remove the page password, or customers hit a login
     screen the second after paying.

     It reads name / when / svc / session_id / amt / dep off the URL,
     which the Stripe scenario appends. Missing values just drop out.
     The customer's name is removed from the address bar straight after
     it's read, so later tracking hits don't carry it. Best fix is still
     to stop the Make scenario putting name= in the URL at all.
     ========================================================================== -->

    width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(255,255,255,.22); color:#fff !important;
    text-decoration:none !important; background:none !important;
    transition:border-color .15s ease, transform .15s ease;

  .mpsok .mpsok-social a:hover{ border-color:#E3FC02; transform:translateY(-1px); }
  .mpsok-social svg{ width:17px; height:17px; fill:currentColor; }
  .mpsok-foot{ margin:0; font-size:13px; color:rgba(255,255,255,.7); }
  .mpsok .mpsok-foot a{ color:#00B8FF !important; font-weight:800; text-decoration:none !important; }
  @media(max-width:420px){
    .mpsok .mpsok-btn{ flex:1 1 100%; text-align:center; }
  }
</style>

<script>
(function(){
  var root = document.getElementById('mpsokRoot');
  if(!root) return;
  function q(k){
    try{ var v = new URLSearchParams(window.location.search).get(k); return v ? v.trim() : ''; }
    catch(e){ return ''; }
  }

  var name = q('name');
  if(name){
    document.getElementById('mpsokHead').textContent =
      'Thank you, ' + name.replace(/[<>]/g,'').slice(0,30) + ' — you’re booked in';
    /* take the name back out of the address bar so the purchase hit
       (and anything after it) doesn't send it to Google / Meta / Reddit */
    try{
      var p = new URLSearchParams(window.location.search);
      p.delete('name');
      var qs = p.toString();
      history.replaceState(history.state, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
    }catch(e){}
  }

  var svc = q('svc'), when = q('when');
  if(svc || when){
    if(svc) document.getElementById('mpsokSvc').textContent = svc.replace(/[<>]/g,'');
    if(when){
      var pretty = when;
      try{
        var d = new Date(when);
        if(!isNaN(d)){
          pretty = d.toLocaleDateString('en-GB',{ weekday:'long', day:'numeric', month:'long' }) +
                   ' at ' + when.slice(11,16);
        }
      }catch(e){}
      document.getElementById('mpsokTime').textContent = pretty;
    }
    document.getElementById('mpsokWhen').hidden = false;
  }

  /* ====================================================================
     CONVERSION TRACKING

     Fires once per booking, on the page people land on after paying.
     Everything goes into the dataLayer; GTM (GTM-MMHW32R2) decides what
     to do with it. In GTM, trigger the GA4 purchase tag on 'purchase'
     ONLY — not also on mps_booking_confirmed, or bookings count twice.

     ONLY A REAL STRIPE RETURN COUNTS: no cs_live_/cs_test_ session id
     means someone just opened the page (you, a preview, a crawler),
     so nothing is recorded.

     DEDUPLICATED by the Stripe session id in localStorage: a refresh,
     a new tab, a bookmark or the back button won't count a second time.
     A genuine second booking has a different id, so it still counts.

     VALUES
       value         the whole job, in pounds   (?amt, sent in pence)
       deposit_paid  what Stripe actually took  (?dep, sent in pence)
     Until every questionnaire sends amt, value falls back to
     deposit x 10 (the deposit is 10%); value_source says which was used.
     ==================================================================== */
  /* svc label -> the same slug each questionnaire uses as FUNNEL_SERVICE,
     so purchase lines up with quote_start ... begin_checkout in GA4.
     Matched anywhere in the label, ignoring case and punctuation, so both
     "Protection Detail" and the Stripe line "10% deposit - Protection
     Detail, 5-door + engine bay" work. No match: service is null. */
  var SERVICE_SLUGS = [
    ['maintenance wash',        'maintenance_wash'],
    ['interior deep clean',     'interior_deep_clean'],
    ['exterior detail',         'exterior_detail'],
    ['in and out deep clean',   'in_and_out'],
    ['protection detail',       'protection_detail'],
    ['machine polishing',       'machine_polishing'],
    ['odour removal',           'odour_removal'],
    ['ceramic coating',         'ceramic_coating'],
    ['window tinting',          'window_tinting'],
    ['de chrome',               'de_chrome']
  ];
  function serviceSlug(label){
    var t = ' ' + String(label || '').toLowerCase().replace(/&/g, ' and ')
                  .replace(/[^a-z0-9]+/g, ' ') + ' ';
    for(var i = 0; i < SERVICE_SLUGS.length; i++){
      if(t.indexOf(' ' + SERVICE_SLUGS[i][0] + ' ') > -1) return SERVICE_SLUGS[i][1];
    }
    return null;
  }

  var sid = q('session_id');
  window.dataLayer = window.dataLayer || [];
  if(!/^cs_(live|test)_/.test(sid)) return;

  var amtPence = parseInt(q('amt'), 10);
  var depPence = parseInt(q('dep'), 10);
  var deposit  = isFinite(depPence) ? depPence / 100 : null;
  var value = isFinite(amtPence) ? amtPence / 100
            : (deposit !== null ? Math.round(deposit * 1000) / 100 : null);

  var key = 'mps_conv_' + sid, already = false;
  try{ already = localStorage.getItem(key) === '1'; }catch(e){}
  if(!already){ try{ already = sessionStorage.getItem(key) === '1'; }catch(e){} }
  if(already){
    window.dataLayer.push({ event:'mps_booking_confirmed_repeat', transaction_id: sid });
    return;
  }
  try{ localStorage.setItem(key, '1'); }catch(e){}
  try{ sessionStorage.setItem(key, '1'); }catch(e){}

  /* GA4 ecommerce shape, so the standard purchase tag works unchanged */
  window.dataLayer.push({ ecommerce: null });
  window.dataLayer.push({
    event: 'purchase',
    ecommerce: {
      transaction_id: sid,
      value: value,
      currency: 'GBP',
      items: [{
        item_name: svc || 'MobilePitStop booking',
        item_category: 'Detailing',
        price: value,
        quantity: 1
      }]
    },
    service: serviceSlug(svc),
    deposit_paid: deposit,
    value_source: isFinite(amtPence) ? 'amt' : 'deposit_x10',
    booking_when: when || null
  });

  /* a plainer event too, for Ads / Meta / Reddit tags if you add them */
  window.dataLayer.push({
    event: 'mps_booking_confirmed',
    transaction_id: sid,
    value: value,
    deposit_paid: deposit,
    service: svc || null
  });
})();
</script>
